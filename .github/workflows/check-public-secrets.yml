name: Check public frontend for secrets
on:
  push:
    branches: [main]
    paths: ['*.js', '*.html', '*.css', '*.json', 'scripts/check-public-secrets.py', '.github/workflows/check-public-secrets.yml']
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 scripts/check-public-secrets.py
